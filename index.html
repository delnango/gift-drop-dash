<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Gift Drop Dash</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--u:1px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#070b26;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:'Press Start 2P',ui-monospace,Menlo,Consolas,monospace;color:#fff}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.hidden{display:none!important}
.o{text-shadow:calc(var(--u)*1) 0 0 #1b1030,calc(var(--u)*-1) 0 0 #1b1030,0 calc(var(--u)*1) 0 #1b1030,0 calc(var(--u)*-1) 0 #1b1030,calc(var(--u)*1) calc(var(--u)*2) 0 #1b1030}
#hud{position:absolute;left:0;right:0;top:0;pointer-events:none;text-align:center;padding-top:calc(var(--u)*7)}
#score{font-size:calc(var(--u)*20);line-height:1;color:#ffe27a;text-shadow:calc(var(--u)*2) 0 0 #1b1030,calc(var(--u)*-2) 0 0 #1b1030,0 calc(var(--u)*-2) 0 #1b1030,0 calc(var(--u)*2) 0 #b0202a,0 calc(var(--u)*4) 0 #1b1030;transition:transform .08s}
#score.pop{transform:scale(1.25)}
#best{margin-top:calc(var(--u)*6);font-size:calc(var(--u)*6);color:#cfe0ff}
#speed{position:absolute;left:calc(var(--u)*7);top:calc(var(--u)*8);text-align:left;font-size:calc(var(--u)*5);color:#cfe0ff}
#speed .bar{margin-top:calc(var(--u)*3);width:calc(var(--u)*40);height:calc(var(--u)*6);background:#1b1030;border:calc(var(--u)*1) solid #1b1030;box-shadow:0 0 0 calc(var(--u)*1) #cfe0ff}
#speed i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fd06a,#ffe27a,#ff5a3a)}
.iconbtn{position:absolute;top:calc(var(--u)*6);right:calc(var(--u)*6);width:calc(var(--u)*22);height:calc(var(--u)*22);padding:0;font:inherit;font-size:calc(var(--u)*9);color:#fff;background:#24307a;border:calc(var(--u)*2) solid #1b1030;box-shadow:inset 0 calc(var(--u)*-2) 0 #141c52,inset 0 calc(var(--u)*2) 0 #4a5ec0;cursor:pointer;z-index:5}
.iconbtn.off{color:#7a84b8}
.iconbtn.off::after{content:"";position:absolute;left:15%;right:15%;top:45%;height:calc(var(--u)*2);background:#ff5a5a;transform:rotate(-40deg)}
#pads{position:absolute;left:0;right:0;bottom:calc(var(--u)*6);display:flex;justify-content:space-between;padding:0 calc(var(--u)*6);pointer-events:none}
.pad{width:calc(var(--u)*54);height:calc(var(--u)*54);border:calc(var(--u)*2) solid rgba(255,255,255,.55);background:rgba(20,30,90,.28);display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*18);color:rgba(255,255,255,.85);box-shadow:inset 0 0 0 calc(var(--u)*2) rgba(0,0,0,.25)}
.pad.on{background:rgba(255,210,58,.55);border-color:#ffe27a;color:#fff}
#hearts{position:absolute;left:calc(var(--u)*7);top:calc(var(--u)*30);display:flex;gap:calc(var(--u)*3)}
#hearts i{width:calc(var(--u)*11);height:calc(var(--u)*10);background:#3a2448;clip-path:polygon(50% 100%,0 40%,0 15%,15% 0,35% 0,50% 15%,65% 0,85% 0,100% 15%,100% 40%);display:block}
#hearts i.on{background:#ff3a4a;box-shadow:inset 0 calc(var(--u)*2) 0 #ff8a96}
#mult{margin-top:calc(var(--u)*5);font-size:calc(var(--u)*7);color:#7dff8a;min-height:calc(var(--u)*8)}
#mult.m3,#mult.m4,#mult.m5{color:#ffd23a}
#tier{position:absolute;right:calc(var(--u)*34);top:calc(var(--u)*12);font-size:calc(var(--u)*5);color:#cfe0ff}
#banner.streak{color:#ffd23a}#banner.life{color:#ff6a7a}#banner.tier{color:#7dff8a}
#fstats{font-size:calc(var(--u)*5.5);line-height:1.9;color:#cfe0ff}
#hints{position:absolute;left:0;right:0;bottom:calc(var(--u)*8);display:flex;justify-content:space-between;padding:0 calc(var(--u)*8);pointer-events:none;transition:opacity .6s}
.hint{font-size:calc(var(--u)*14);color:#fff;opacity:.8;text-align:center;animation:pulse 1s steps(2) infinite}
.hint small{display:block;font-size:calc(var(--u)*5);margin-top:calc(var(--u)*3)}
@keyframes pulse{50%{opacity:.35}}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-size:calc(var(--u)*14);color:#ffe27a;pointer-events:none}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*9);padding:calc(var(--u)*12);text-align:center;background:linear-gradient(rgba(7,11,38,.55),rgba(7,11,38,.25) 45%,rgba(7,11,38,.7))}
h1{margin:0;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*5)}
h1 span{display:block;text-shadow:calc(var(--u)*2) 0 0 #1b1030,calc(var(--u)*-2) 0 0 #1b1030,0 calc(var(--u)*-2) 0 #1b1030,0 calc(var(--u)*2) 0 #1b1030,0 calc(var(--u)*4) 0 #1b1030}
.t1{font-size:calc(var(--u)*12);color:#fff}
.t2{font-size:calc(var(--u)*17);color:#ff4a3a}
.t3{font-size:calc(var(--u)*19);color:#ffd23a}
.card{background:rgba(16,22,70,.88);border:calc(var(--u)*2) solid #1b1030;box-shadow:inset 0 0 0 calc(var(--u)*1) #4a5ec0;padding:calc(var(--u)*7);font-size:calc(var(--u)*5.5);line-height:1.7;max-width:calc(var(--u)*244);text-align:left}
.card p{margin:0 0 calc(var(--u)*5)}
.card p:last-child{margin:0}
.card .row{display:flex;align-items:center;gap:calc(var(--u)*4)}
.card img{height:calc(var(--u)*16);image-rendering:pixelated;flex:none}
.ok{color:#7dff8a}.bad{color:#ff6a5a}
b{color:#ffe27a;font-weight:normal}
button.big{font:inherit;font-size:calc(var(--u)*10);color:#fff;padding:calc(var(--u)*9) calc(var(--u)*14);background:#d42a2a;border:calc(var(--u)*2) solid #1b1030;box-shadow:inset 0 calc(var(--u)*-3) 0 #9c1c22,inset 0 calc(var(--u)*2) 0 #ff7a6a,0 calc(var(--u)*3) 0 #1b1030;cursor:pointer;animation:bob 1.2s steps(2) infinite}
button.big:active{transform:translateY(calc(var(--u)*2))}
@keyframes bob{50%{transform:translateY(calc(var(--u)*-1))}}
button.small{font:inherit;font-size:calc(var(--u)*6);color:#fff;padding:calc(var(--u)*6) calc(var(--u)*8);background:#24307a;border:calc(var(--u)*2) solid #1b1030;box-shadow:inset 0 calc(var(--u)*-2) 0 #141c52,inset 0 calc(var(--u)*2) 0 #4a5ec0;cursor:pointer}
.bestline{font-size:calc(var(--u)*7);color:#ffe27a}
.keys{font-size:calc(var(--u)*4.5);color:#9fb0e6}
h2{margin:0;font-size:calc(var(--u)*18);color:#ff4a3a;text-shadow:calc(var(--u)*2) 0 0 #1b1030,calc(var(--u)*-2) 0 0 #1b1030,0 calc(var(--u)*-2) 0 #1b1030,0 calc(var(--u)*2) 0 #1b1030,0 calc(var(--u)*4) 0 #1b1030}
#reason{font-size:calc(var(--u)*6.5);line-height:1.6;color:#fff;max-width:calc(var(--u)*230)}
.scores{display:flex;gap:calc(var(--u)*10)}
.scores div{background:rgba(16,22,70,.88);border:calc(var(--u)*2) solid #1b1030;box-shadow:inset 0 0 0 calc(var(--u)*1) #4a5ec0;padding:calc(var(--u)*7) calc(var(--u)*10);font-size:calc(var(--u)*6);color:#cfe0ff;min-width:calc(var(--u)*80)}
.scores b{display:block;margin-top:calc(var(--u)*6);font-size:calc(var(--u)*16);color:#ffe27a}
#newbest{font-size:calc(var(--u)*8);color:#7dff8a;animation:pulse .5s steps(2) infinite}
.btnrow{display:flex;gap:calc(var(--u)*6)}
#copied{font-size:calc(var(--u)*5);color:#7dff8a;min-height:calc(var(--u)*6)}

.scr{justify-content:flex-start;gap:calc(var(--u)*5);padding-top:calc(var(--u)*16);background:linear-gradient(rgba(7,11,38,.45),rgba(7,11,38,.1) 55%,rgba(7,11,38,0))}
.logowrap{position:relative;width:calc(var(--u)*246);animation:drop .9s cubic-bezier(.3,1.5,.5,1) both}
.logo{width:100%;display:block;animation:bob 2.6s ease-in-out infinite}
.tw{position:absolute;width:calc(var(--u)*6);height:calc(var(--u)*6);background:radial-gradient(#fff 20%,rgba(255,240,170,.8) 35%,transparent 60%);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:tw 1.8s steps(4) infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.2)}}
@keyframes drop{0%{transform:translateY(calc(var(--u)*-140))}100%{transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(calc(var(--u)*-3)) rotate(.6deg)}}
@keyframes rise{0%{opacity:0;transform:translateY(calc(var(--u)*30))}100%{opacity:1;transform:none}}
@keyframes pulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes swing{0%{transform:translateY(calc(var(--u)*-160)) rotate(-8deg)}60%{transform:translateY(calc(var(--u)*6)) rotate(3deg)}80%{transform:rotate(-1.5deg)}100%{transform:none}}
.imgbtn{background:none;border:0;padding:0;cursor:pointer;animation:rise .6s .3s both}
.imgbtn img{display:block;width:100%}
.imgbtn.pulse img{animation:pulse2 1.1s ease-in-out infinite}
.imgbtn:active img{transform:scale(.95)}
#start{width:calc(var(--u)*176)}#again{width:calc(var(--u)*176);margin-top:calc(var(--u)*2)}#home{width:calc(var(--u)*150);animation-delay:.45s}
.help{width:calc(var(--u)*214);animation:rise .6s .45s both}
.modes{display:flex;gap:calc(var(--u)*5);animation:rise .6s .15s both}
.mode{font:inherit;font-size:calc(var(--u)*7);color:#fff;padding:calc(var(--u)*6) calc(var(--u)*8);border:calc(var(--u)*2) solid #1b1030;cursor:pointer;opacity:.6;box-shadow:inset 0 calc(var(--u)*-2) 0 rgba(0,0,0,.3),inset 0 calc(var(--u)*2) 0 rgba(255,255,255,.35)}
.m-easy{background:#2f9e44}.m-medium{background:#d88a12}.m-hard{background:#c42228}
.mode.sel{opacity:1;outline:calc(var(--u)*2) solid #ffe27a;transform:translateY(calc(var(--u)*-1))}
#modeinfo{font-size:calc(var(--u)*5);color:#cfe0ff;min-height:calc(var(--u)*6);animation:rise .6s .2s both}
.legend{background:rgba(16,22,70,.82);border:calc(var(--u)*1.5) solid #1b1030;padding:calc(var(--u)*2.5) calc(var(--u)*5);font-size:calc(var(--u)*4.6);color:#fff;display:flex;align-items:center;gap:calc(var(--u)*2);animation:rise .6s .55s both}
.legend img{height:calc(var(--u)*10)}.gold{color:#ffd23a}
.bestline{font-size:calc(var(--u)*10);color:#ffd23a;text-shadow:calc(var(--u)*1.5) 0 0 #1b1030,calc(var(--u)*-1.5) 0 0 #1b1030,0 calc(var(--u)*1.5) 0 #1b1030,0 calc(var(--u)*-1.5) 0 #1b1030,0 calc(var(--u)*3) 0 #1b1030;animation:rise .6s .6s both}
.signwrap{position:relative;width:calc(var(--u)*226);animation:swing 1.1s cubic-bezier(.3,1.2,.5,1) both;transform-origin:50% 0}
.sign{width:100%;display:block}
#fscore{position:absolute;left:52.9%;top:88.8%;transform:translate(-50%,-50%);font-size:calc(var(--u)*15);color:#ffd23a;text-shadow:calc(var(--u)*1.5) 0 0 #3a1c0c,calc(var(--u)*-1.5) 0 0 #3a1c0c,0 calc(var(--u)*1.5) 0 #3a1c0c,0 calc(var(--u)*-1.5) 0 #3a1c0c,0 calc(var(--u)*2.5) 0 #1b1030}
#over #reason{animation:rise .5s .5s both}#over #fstats{animation:rise .5s .6s both;background:rgba(16,22,70,.8);border:calc(var(--u)*2) solid #1b1030;padding:calc(var(--u)*4) calc(var(--u)*7)}
#over .btnrow{animation:rise .5s .6s both;align-items:center}#fbest{font-size:calc(var(--u)*6);color:#ffd23a}
#banner{top:23%!important}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="cv" width="270" height="480"></canvas>
  <div id="hud" class="hidden">
    <div id="speed" class="o">SPEED<div class="bar"><i id="speedfill"></i></div></div>
    <div id="score">0</div>
    <div id="best" class="o">BEST 0</div>
    <div id="mult" class="o"></div>
    <div id="hearts"></div>
    <div id="tier" class="o">EASY</div>
  </div>
  <div id="pads" class="hidden"><div class="pad o" id="padL">&#9664;</div><div class="pad o" id="padR">&#9654;</div></div>
  <div id="banner" class="o hidden">GET READY!</div>
  <div id="title" class="panel scr">
    <div class="logowrap"><img class="logo" src="ui_logo.png" alt="Gift Drop Dash"><i class="tw" style="left:12%;top:22%"></i><i class="tw" style="left:86%;top:30%;animation-delay:.4s"></i><i class="tw" style="left:48%;top:4%;animation-delay:.9s"></i><i class="tw" style="left:70%;top:78%;animation-delay:1.3s"></i></div>
    <div class="modes"><button class="mode m-easy" data-m="easy">EASY</button><button class="mode m-medium" data-m="medium">MEDIUM</button><button class="mode m-hard" data-m="hard">HARD</button></div>
    <div id="modeinfo" class="o"></div>
    <button id="start" class="imgbtn pulse"><img src="ui_btn_play.png" alt="Play"></button>
    <img class="help" src="ui_panel_help.png" alt="Tap left or right to deliver presents">
    <div class="legend o"><span class="gold">GOLD RING</span> = DELIVER &nbsp;<span class="bad">RED !</span> = TRAP <img id="ic-cat" alt=""><img id="ic-crow" alt=""><img id="ic-tnt" alt=""><img id="ic-bomb" alt=""></div>
    <div class="bestline">BEST SCORE: <span id="tbest">0</span></div>
  </div>
  <div id="over" class="panel scr hidden">
    <div class="signwrap"><img class="sign" src="ui_sign.png" alt="Game Over"><div id="fscore">0</div></div>
    <div id="newbest" class="o hidden">&#9733; NEW BEST! &#9733;</div>
    <div id="reason" class="o"></div>
    <div id="fstats" class="o"></div>
    <button id="again" class="imgbtn pulse"><img src="ui_btn_again.png" alt="Play again"></button>
    <button id="home" class="imgbtn"><img src="ui_btn_menu.png" alt="Main menu"></button>
    <div class="btnrow"><button id="copy" class="small o">COPY SCORE</button><span id="fbest" class="o"></span></div>
    <div id="copied" class="o"></div>
  </div>
  <div id="paused" class="panel hidden"><h2>PAUSED</h2><button id="resume" class="big o">RESUME</button></div>
  <button id="snd" class="iconbtn o" aria-label="Toggle sound">&#9835;</button>
</div></div>
<script>
'use strict';
/* =========================================================
   GAMEPLAY TUNING — every difficulty number lives here
   ========================================================= */
const CFG = {
  lives: 3, maxLives: 5,
  // selectable difficulty: multiplies speed and delivery window; sets how often a bonus heart arrives
  modes: {
    easy:   { label:'EASY',   speed:1.00, window:1.00, lifeEvery:30, info:'RELAXED START  +1 HEART EVERY 30' },
    medium: { label:'MEDIUM', speed:1.18, window:0.84, lifeEvery:45, info:'FASTER  SHORTER WINDOWS  +1 HEART EVERY 45' },
    hard:   { label:'HARD',   speed:1.36, window:0.70, lifeEvery:65, info:'FASTEST  TIGHT WINDOWS  +1 HEART EVERY 65' }
  },
  minWindow: 0.40,                 // seconds — no mode ever goes below this
  bonusLifeEvery: 30,             // an extra heart every N deliveries (up to maxLives)
  readyTime: 1.6,
  rowSpacing: 7.2, zSpawn: 175, zFirstPlan: 34,
  // delivery zone: a chimney can be targeted while zoneNear <= z <= zoneNear + window*speed
  zoneNear: 9.5,
  approachTime: 1.0,              // amber "approaching" glow shown this long before the window opens
  inputBuffer: 0.22,              // a press this early still fires when the chimney becomes ready
  throwDelay: 0.08,               // Santa's grab before the present leaves his hand
  flightMax: 0.34, flightMin: 0.16,
  perfectBand: [0.3, 0.75],       // middle part of the window counts as PERFECT timing
  points: { delivery: 10, perfect: 5, golden: 50 },
  streakMult: [[0,1],[5,2],[10,3],[20,4],[35,5]],
  streakCelebrate: [5,10,15,20,25,30,40,50,60,75,100],
  goldenChance: 0.08, goldenFrom: 4,
  timeWeight: 1/25,               // every 25 s survived counts as one delivery towards difficulty
  tiers: [
    { name:'EASY',         at:0,  speed:5.0,  window:1.20, hazard:0.08, pair:0.00, double:0.00, chimney:0.55, alternate:0.90, warn:1.7 },
    { name:'NORMAL',       at:11, speed:7.0,  window:1.00, hazard:0.20, pair:0.12, double:0.03, chimney:0.70, alternate:0.72, warn:1.3 },
    { name:'INTERMEDIATE', at:26, speed:9.0,  window:0.85, hazard:0.30, pair:0.22, double:0.08, chimney:0.82, alternate:0.60, warn:1.0 },
    { name:'HARD',         at:51, speed:11.0, window:0.72, hazard:0.36, pair:0.28, double:0.12, chimney:0.88, alternate:0.52, warn:0.8 },
    { name:'EXPERT',       at:76, speed:13.0, window:0.62, hazard:0.42, pair:0.32, double:0.15, chimney:0.92, alternate:0.50, warn:0.65 }
  ],
  expertSpeedMax: 16.0, expertRampTo: 150,   // speed keeps creeping up after 76 until this many deliveries
  maxHazardRun: 2,                           // never more than this many hazard-only chimneys in a row
  hazards: ['cat','crow','tnt','bomb','coal'],
  hazardFrom: { coal: 15 },                  // deliveries before a hazard type can appear
  tellZ: 85, trembleZ: 50,
  zDeliver: 12,                              // visual only: where a present thrown at nothing lands
  speedStart: 5.0, speedMax: 16.0            // used for the music tempo and the speed bar
};

/* =========================================================
   SETUP — same logical frame and camera as before
   ========================================================= */
const W = 270; let H = 480, HZ = 150, Q = 3;
const CX = 135, F = 210, CAMY = 13.9, NEAR = 1.3, HLEN = 7.5;
const LANEX = 5.6;              // typical chimney lane (used only for presents thrown at nothing)
const XS = 4.3, HXS = 4.0, ROW = CFG.rowSpacing, TX = 16;
const YAW = -24*Math.PI/180, YC = Math.cos(YAW), YS = Math.sin(YAW);
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
function mulberry(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
let rnd = mulberry(1);
const pick = a => a[(rnd()*a.length)|0];
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;return [c,g];}
function proj(x,y,z){const s=F/z;return [CX+x*s, HZ+(CAMY-y)*s];}
let rows=[], particles=[], flakes=[], motes=[], puffs=[];

/* =========================================================
   2D ART ASSETS (supplied PNGs)
   ========================================================= */
const ASSET_FILES = {
  sky:'background_sky_nomoon.png', moon:'moon.png', village:'distant_village_panorama.png',
  sleigh:'santa_sleigh_rear_view.png', deer1:'reindeer_pose_01.png', deer2:'reindeer_pose_02.png',
  cat:'hazard_cat_emerge.png', crow:'hazard_crow_emerge.png', tnt:'hazard_tnt.png', bomb:'hazard_bomb.png',
  catFull:'hazard_cat_full.png', crowFull:'hazard_crow_full.png', smoke:'fx_smoke.png', boom:'fx_explosion.png'
};
for(let i=1;i<=12;i++)ASSET_FILES['p'+i]='present_'+String(i).padStart(2,'0')+'.png';
const IMG = {}; let PRESENTS = [];
function loadAssets(){
  return Promise.all(Object.entries(ASSET_FILES).map(([k,f])=>new Promise((res,rej)=>{
    const im=new Image();im.onload=()=>{IMG[k]=im;res();};im.onerror=()=>rej(new Error('Missing asset '+f));im.src=''+f;})));
}

/* =====================================================================
   PIXEL-ART PAINTERS  (alpha 255 = lit, ~200 = emissive, 0 = cut-out)
   ===================================================================== */
const OUT='#1a0e1e';
function R(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));}

  while(mus.next<AC.currentTime+.15){
    const [n,b]=MEL[mus.i];const d=AC.currentTime;tone(midi(n),Math.min(.28,b*bd*.9),'square',.5,0,Math.max(0,mus.next-d),musicGain);
    const startBeat=mus.beat;mus.beat+=b;

/* ---------- difficulty: smooth blend between tiers by deliveries + time survived ---------- */
function level(){return game?game.deliveries+game.elapsed*CFG.timeWeight:0;}
function tierAt(lvl){
  const ts=CFG.tiers;let i=0;while(i<ts.length-1&&lvl>=ts[i+1].at)i++;
  let o;
  if(i===ts.length-1){const t=ts[i],k=clamp((lvl-t.at)/(CFG.expertRampTo-t.at),0,1);o=Object.assign({},t,{speed:lerp(t.speed,CFG.expertSpeedMax,k),idx:i});}
  else{const a=ts[i],b=ts[i+1],k=(lvl-a.at)/(b.at-a.at);o={idx:i,name:a.name};for(const key of ['speed','window','hazard','pair','double','chimney','alternate','warn'])o[key]=lerp(a[key],b[key],k);}
  const m=M();o.speed*=m.speed;o.window=Math.max(CFG.minWindow,o.window*m.window);o.warn=Math.max(.6,o.warn*m.window);return o;
}
function tier(){return tierAt(level());}
function zoneFar(){return CFG.zoneNear+tier().window*v;}
function inZone(z){return z>=CFG.zoneNear&&z<=zoneFar();}
/* ---------- chimneys: world position, zone, state and a single delivery status ---------- */
function addChim(row,side,type,golden){
  const h=row.houses[side<0?0:1];
  h.chim={id:++chimSeq,type,hazard:type!=='safe',golden:!!golden,side,row,house:h,top:h.openY,lx:h.lx,
    status:'pending',   // pending -> targeted -> delivered | hit ; pending -> missed | passed
    delivered:false,delT:0,emerged:false,emT:0,triggered:false,phase:Math.random()*10,gone:false,soundDone:false,warned:false};
  game.chimCount++;
}
function randHazard(){const d=game.deliveries;const opts=CFG.hazards.filter(h=>d>=(CFG.hazardFrom[h]||0));let t;do{t=pick(opts);}while(t===game.lastHazard&&opts.length>1&&Math.random()<.7);game.lastHazard=t;return t;}
function planRow(row){
  const g=game;g.planned++;if(g.planned<=1)return;
  const tp=tierAt(level()+4);                  // plan with a little look-ahead: rows arrive later
  const gap=tp.window*tp.speed+1.5;            // same-side chimneys never share the delivery zone
  const free=sd=>{const last=g.lastRowSide[sd];return !last||row.z-last.z>=gap;};
  if(g.chimCount>0&&Math.random()>tp.chimney)return;
  const first=g.chimCount<3,r=Math.random();
  const sidePick=()=>{let s=Math.random()<tp.alternate?-g.lastSide:g.lastSide;if(!free(s))s=-s;return free(s)?s:0;};
  const golden=()=>g.deliveries>=CFG.goldenFrom&&Math.random()<CFG.goldenChance;
  let hasSafe=true;
  if(!first&&r<tp.pair&&free(-1)&&free(1)){const s=Math.random()<.5?-1:1;addChim(row,s,'safe',golden());addChim(row,-s,randHazard());g.lastRowSide[-1]=row;g.lastRowSide[1]=row;g.lastSide=s;}
  else if(!first&&r<tp.pair+tp.double&&free(-1)&&free(1)){addChim(row,-1,'safe');addChim(row,1,'safe');g.lastRowSide[-1]=row;g.lastRowSide[1]=row;}
  else{const s=sidePick();if(!s)return;g.lastSide=s;g.lastRowSide[s]=row;
    const hz=!first&&g.hazardRun<CFG.maxHazardRun&&Math.random()<tp.hazard;
    addChim(row,s,hz?randHazard():'safe',!hz&&golden());hasSafe=!hz;}
  g.hazardRun=hasSafe?0:g.hazardRun+1;
}

function findTarget(side){let best=null;eachChim(ch=>{if(ch.side!==side||ch.status!=='pending'||ch.gone)return;const z=chimZ(ch);if(inZone(z)&&(!best||z<chimZ(best)))best=ch;});return best;}
function launchAt(side,ch,col){
  const z=chimZ(ch),zf=zoneFar(),q=clamp((zf-z)/(zf-CFG.zoneNear),0,1);
  ch.status='targeted';
  const perfect=!ch.hazard&&q>=CFG.perfectBand[0]&&q<=CFG.perfectBand[1];
  const dur=clamp((z-v*CFG.throwDelay-6.5)/Math.max(v,1),CFG.flightMin,CFG.flightMax);
  throws.push({side,t:CFG.throwDelay,target:ch,perfect,col,dur});
}

/* =========================================================
   UPDATE
   ========================================================= */
function update(dt){
  T+=dt;
  if(state==='play'){
    if(game.ready>0)game.ready-=dt;else game.elapsed+=dt;
    v+=(tier().speed-v)*Math.min(1,dt*0.8);
  }
  else if(state==='title'){v+=(4.2-v)*Math.min(1,dt*2);}
  else if(state==='dying'||state==='over'){v=Math.max(0,v-dt*(v*2.2+.6));}
  if(state==='paused')return;
  if(bannerT>0){bannerT-=dt;show('banner',true);if(bannerT<=0)show('banner',false);}
  const dz=v*dt;dist+=dz;
  for(const r of rows)r.z-=dz;
  while(rows.length&&rows[0].z+HLEN<NEAR){const r=rows.shift();for(const h of r.houses)if(h.chim)h.chim.gone=true;}
  while(rows[rows.length-1].z<CFG.zSpawn){const r=makeRow(rows[rows.length-1].z+CFG.rowSpacing);rows.push(r);if(state==='play')planRow(r);}

  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.t+=dt;p.z-=dz;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.grav){p.vy-=14*dt;if(p.floor!==undefined&&p.y<p.floor){p.y=p.floor;p.vy=Math.abs(p.vy)*.3;p.vx*=.5;if(Math.abs(p.vy)<.6)p.vy=0;}}
    if(p.type==='smoke')p.vy*=.98;
    if(p.t>p.life||p.z<NEAR)particles.splice(i,1);}
  for(let i=sparks2d.length-1;i>=0;i--){const p=sparks2d[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=60*dt;if(p.t>p.life)sparks2d.splice(i,1);}

  const playing=state==='play';
  eachChim(ch=>{
    if(ch.emerged)ch.emT+=dt;if(ch.delivered)ch.delT+=dt;

    if(ch.hazard){
      if(!ch.warned&&z<=zoneFar()+tier().warn*v){ch.warned=true;({cat:()=>tone(300,.14,'sawtooth',.06,200),crow:()=>tone(620,.12,'sawtooth',.05,420),coal:()=>tone(90,.2,'square',.07,60)}[ch.type]||(()=>sfx.fuse(.07)))();}
      if((ch.type==='tnt'||ch.type==='bomb')&&!ch.emerged&&z<CFG.tellZ&&Math.random()<dt*10)particles.push({type:'spark',x:ch.side*(ch.lx-.25),y:ch.top+.9,z,vx:rand(-1.2,1.2),vy:rand(1,3),vz:0,life:.3,t:0,col:pick(['#fff6b0','#ffd23a','#ff9a3a'])});

    }

  });

    for(let i=game.buffer.length-1;i>=0;i--){const b=game.buffer[i];const ch=findTarget(b.side);
      if(ch){game.buffer.splice(i,1);game.stats.buffered++;launchAt(b.side,ch,b.col);continue;}
      b.t-=dt;if(b.t<=0){game.buffer.splice(i,1);game.stats.wasted++;throws.push({side:b.side,t:0,target:null,col:b.col,dur:CFG.flightMax});}}

}

const OPEN_W=1.2;   // inner opening width of the gameplay chimneys (world units)
function chimGeo(ch){
  const z=chimZ(ch),s=F/z,h=ch.house,wx=ch.side*h.lx;

    const sm=IMG.smokeDark,u=t;if(u<.05){shake=.4;flash=.3;}
    for(let i=0;i<8;i++){const an=i/8*Math.PI*2+u*.5,d=u*110,sz=Math.max(6,a.ow*1.4*(1+u*2.5));ctx.globalAlpha=clamp(1-u*.9,0,1);ctx.drawImage(sm,a.x+Math.cos(an)*d-sz/2,a.y+Math.sin(an)*d*.6-sz/2,sz,sz*sm.height/sm.width);ctx.globalAlpha=1;}
    const k=ease(clamp(u/.5,0,1));for(let i=0;i<5;i++){const im=IMG.coal,w=lerp(a.ow*.5,60,k)*(1+i*.15),x=lerp(a.x,CX+(i-2)*30,k),y=lerp(a.y,H-200+(i%2)*20,k);ctx.drawImage(im,x-w/2,y-w*.35,w,w*im.height/im.width);}
  } else {
    if(t<.15){const im=IMG[a.type],w=a.ow*(.6+t*3),h=w*im.height/im.width;ctx.drawImage(im,a.x-w/2,a.y-h,w,h);}
    else{const u=t-.15;if(u<.05){shake=.5;flash=1;}
      const im=IMG.boom,s=(u<.6?1:Math.max(0,1-(u-.6)*3))*(a.ow*1.5+u*360);if(s>0)ctx.drawImage(im,a.x-s/2,a.y-s/2,s,s*im.height/im.width);
      const sm=IMG.smoke;for(let i=0;i<6;i++){const an=i/6*Math.PI*2+u,d=u*120,sz=Math.max(6,a.ow*1.3*(1+u*2));ctx.globalAlpha=clamp(1-u,0,1);ctx.drawImage(sm,a.x+Math.cos(an)*d-sz/2,a.y+Math.sin(an)*d*.6-sz/2,sz,sz*sm.height/sm.width);ctx.globalAlpha=1;}}
  }
}

// pop-up text lives in a feed in the sky under the score, so it never hides a chimney
function drawTexts(){
  const y0=Math.max(66,Math.min(86,HZ*.42));
  for(const t of texts){const k=t.t/.9;ctx.globalAlpha=k<.7?1:1-(k-.7)/.3;const sz=t.big?10:8;ctx.font=`${sz}px 'Press Start 2P', monospace`;ctx.textAlign='center';
    const y=Math.round(y0+t.slot*12-k*6),x=CX;ctx.fillStyle='#1b1030';for(const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1],[1,1]])ctx.fillText(t.text,x+dx,y+dy);ctx.fillStyle=t.col;ctx.fillText(t.text,x,y);ctx.globalAlpha=1;}
}
function drawSnow(dt){
  const fall=1+v*.06;
  for(const f of flakes){f.y+=f.vy*fall*dt;f.x+=(f.vx+Math.sin(T*1.3+f.ph)*6)*dt;if(f.y>H){f.y=-2;f.x=Math.random()*W;}if(f.x<-2)f.x=W;if(f.x>W+2)f.x=0;
    ctx.fillStyle=f.s>1?'rgba(255,255,255,.95)':'rgba(230,238,255,.7)';ctx.fillRect(Math.round(f.x),Math.round(f.y),f.s,f.s);}
}
function render(dt){
  ctx.save();
  if(shake>0){ctx.translate(Math.round(rand(-3,3)*Math.min(1,shake*3)),Math.round(rand(-3,3)*Math.min(1,shake*3)));}
  drawWorld(dt);drawSanta();drawPresents();drawAttack();drawTexts();
  if(state!=='paused')drawSnow(dt);
  ctx.restore();
  if(flash>0){ctx.fillStyle=`rgba(255,250,230,${Math.min(.85,flash)})`;ctx.fillRect(0,0,W,H);}
  if(state==='dying'||state==='over'){const k=state==='over'?1:clamp(game.dieT/1.5,0,1);ctx.fillStyle=`rgba(10,8,40,${k*.35})`;ctx.fillRect(0,0,W,H);}
}


/* =========================================================
   LAYOUT + LOOP
   ========================================================= */
function layout(){
  const vw=window.innerWidth,vh=window.innerHeight;
  H=Math.round(clamp(W*vh/vw,440,600));
  const sc=Math.min(vw/W,vh/H);stage.style.width=W*sc+'px';stage.style.height=H*sc+'px';stage.style.setProperty('--u',sc+'px');
  Q=clamp(Math.round(sc*(window.devicePixelRatio||1)),1,5);
  cv.width=W*Q;cv.height=H*Q;ctx.setTransform(Q,0,0,Q,0,0);ctx.imageSmoothingEnabled=false;
  HZ=H-330;
  flakes=[];for(let i=0;i<110;i++)flakes.push({x:Math.random()*W,y:Math.random()*H,vy:rand(12,40),vx:rand(-6,2),s:Math.random()<.25?1.5:1,ph:Math.random()*6});
  motes=[];for(let i=0;i<26;i++)motes.push({x:Math.random()*W,y:HZ+Math.random()*(H-HZ),vy:3+Math.random()*6,sp:.6+Math.random(),ph:Math.random()*6,big:Math.random()<.35});
  STARS=[];for(let i=0;i<60;i++)STARS.push({x:Math.random()*W,y:Math.random()*300,s:Math.random()<.2?1.5:.75,sp:.4+Math.random(),ph:Math.random()*3});
}
window.addEventListener('resize',()=>{if(READY)layout();});
let last=performance.now(),READY=false;
let LOOP=true;
function frame(now){
  if(!LOOP)return;
  let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;if(dt<0)dt=0;
  update(dt);render(dt);musicTick();
  requestAnimationFrame(frame);
}
function icons(){const set=(id,f)=>{$(id).src=''+f;};set('ic-cat','hazard_cat_emerge.png');set('ic-crow','hazard_crow_emerge.png');set('ic-tnt','hazard_tnt.png');set('ic-bomb','hazard_bomb.png');}
$('start').disabled=true;$('start').style.opacity=.5;
loadAssets().then(()=>{
  PRESENTS=[];for(let i=1;i<=12;i++)PRESENTS.push(IMG['p'+i]);
  GLOW=(()=>{const [c,g2]=mk(64,64);const gr=g2.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'rgba(255,220,130,.9)');gr.addColorStop(.35,'rgba(255,190,90,.35)');gr.addColorStop(1,'rgba(255,170,60,0)');g2.fillStyle=gr;g2.fillRect(0,0,64,64);return c;})();
  IMG.coal=(()=>{const [c,g2]=mk(26,20);const lump=(x,y,r)=>{for(let yy=-r;yy<=r;yy++){const w=Math.round(Math.sqrt(r*r-yy*yy));g2.fillStyle='#1b1030';g2.fillRect(x-w-1,y+yy,w*2+2,1);}for(let yy=-r+1;yy<r;yy++){const w=Math.round(Math.sqrt((r-1)*(r-1)-yy*yy));g2.fillStyle=yy<-r/3?'#4a4a5a':'#26262e';g2.fillRect(x-w,y+yy,w*2,1);}};
    lump(7,12,6);lump(18,11,7);lump(12,6,5);g2.fillStyle='#ff6a1a';[[6,13],[7,14],[17,12],[18,13],[19,11],[12,7]].forEach(([x,y])=>g2.fillRect(x,y,1,1));g2.fillStyle='#ffd23a';g2.fillRect(18,12,1,1);g2.fillRect(7,13,1,1);return c;})();
  IMG.smokeDark=(()=>{const s=IMG.smoke,[c,g2]=mk(s.width,s.height);g2.drawImage(s,0,0);g2.globalCompositeOperation='source-atop';g2.fillStyle='rgba(30,26,40,.78)';g2.fillRect(0,0,s.width,s.height);return c;})();
  MOONHALO=moonHalo();buildScene();layout();resetWorld();icons();setSound(soundOn);
  $('start').disabled=false;$('start').style.opacity='';setMode(mode);READY=true;last=performance.now();requestAnimationFrame(frame);
}).catch(e=>{$('modeinfo').textContent='LOADING FAILED';console.error(e);});
window.__scd={get v(){return v},get state(){return state},get game(){return game},start:startGame,tap:onTap,rows:()=>rows,chimZ,setV:x=>v=x,CFG,
  // balance-testing hooks: run the simulation without drawing, and read chimney state
  step(n,dt=1/60){for(let i=0;i<n;i++)update(dt);},zone:()=>[CFG.zoneNear,zoneFar()],tier:()=>tier(),
  chims(){const o=[];eachChim(c=>o.push({id:c.id,side:c.side,z:chimZ(c),hazard:c.hazard,status:c.status,golden:c.golden}));return o;},
  stopLoop(){LOOP=false;}};

</script>
